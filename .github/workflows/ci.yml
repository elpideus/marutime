name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marutime
          POSTGRES_PASSWORD: marutime
          POSTGRES_DB: marutime
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U marutime" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://marutime:marutime@localhost:5432/marutime
      SESSION_SECRET: ci-session-secret-ci-session-secret-ci-session-secret
      METADATA_PROVIDER: fixture
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm build
